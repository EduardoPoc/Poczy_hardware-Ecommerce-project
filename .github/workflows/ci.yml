name: Tests and production build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run API tests against isolated MySQL
        run: docker compose -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from tests
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f compose.test.yaml logs --tail=100
      - name: Remove the temporary test environment
        if: always()
        run: docker compose -f compose.test.yaml down --volumes

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MYSQL_DATABASE: ecommerce_ci
      MYSQL_USER: ecommerce_ci
      MYSQL_PASSWORD: ci_only_password
      MYSQL_ROOT_PASSWORD: ci_only_root_password
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://127.0.0.1:8080
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:8080
      SESSION_SECURE_COOKIE: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Compose and build production images, frontend tests and assets
        run: |
          docker compose -f compose.prod.yaml config --quiet
          docker compose -f compose.prod.yaml build
      - name: Prepare the database and start the application
        run: |
          docker compose -f compose.prod.yaml up -d mysql --wait
          docker compose -f compose.prod.yaml run --rm api php artisan migrate --force --no-interaction
          docker compose -f compose.prod.yaml up -d --wait
      - name: Check production pages, API, documentation and Nginx
        run: |
          set -euo pipefail
          for path in / /login /cadastro /pesquisa /produto /carrinho /conta /checkout /admin /api/docs /api/products; do
            curl --fail --silent --show-error "http://127.0.0.1:8080$path" > /dev/null
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/pagina-inexistente)" = 404
          docker compose -f compose.prod.yaml exec -T frontend nginx -t
          docker compose -f compose.prod.yaml exec -T proxy nginx -t
      - name: Verify uploads survive container replacement
        run: |
          set -euo pipefail
          docker compose -f compose.prod.yaml exec -T api sh -c 'printf persistence-ok > storage/app/public/ci-persistence.txt'
          docker compose -f compose.prod.yaml up -d --force-recreate --wait api frontend proxy
          curl --fail --silent --show-error --retry 12 --retry-delay 1 --retry-all-errors http://127.0.0.1:8080/storage/ci-persistence.txt | grep -qx persistence-ok
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f compose.prod.yaml logs --tail=100
      - name: Remove the temporary production environment
        if: always()
        run: docker compose -f compose.prod.yaml down --volumes

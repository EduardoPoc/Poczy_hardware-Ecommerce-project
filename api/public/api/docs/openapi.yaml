openapi: 3.0.3
info:
  title: 'Poczy Hardware API'
  version: 1.0.0
  description: |-
    Contrato das rotas atuais de api/routes/api.php, controllers, Form Requests, Resources, services, models, migrations e bootstrap/app.php. Servido estaticamente em /api/docs/openapi.yaml.

    Sessão e CSRF: GET /sanctum/csrf-cookie inicializa cookies; POST /api/login autentica pelo guard web (driver session). Preserve cookies em todas as chamadas e envie X-XSRF-TOKEN (cookie XSRF-TOKEN URL-decodificado) em POST/PUT/PATCH/DELETE. A UI faz isso automaticamente, sempre no mesmo host. Use login abaixo; cadastro não autentica. Logout e troca de senha invalidam sessão. O nome do cookie de sessão é configurável por SESSION_COOKIE, ou derivado de APP_NAME em config/session.php; não há token de autenticação emitido por estas rotas. Por isso a autenticação é descrita por operação, sem esquema manual de credenciais no botão Authorize.

    Acesso: catálogo/produtos/marcas/categorias públicos. Carrinho permite visitante vinculado à sessão. Perfil/endereços/pedidos/checkout exigem auth:web. /api/admin/* exige também gate manage-shop, definido como role === ADMIN. Não há policies/permissões adicionais. Endereços sempre pertencem ao usuário; detalhe/pagamento/cancelamento de pedido permitem ADMIN acessar outras contas, enquanto listagem /api/orders continua própria.

    JSON: Resources usam {data: ...}; login e cadastro retornam campos do usuário diretamente, com cart_merge condicional. Listas de produtos, pedidos e estoque têm data/links/meta; outras listas não são paginadas. Dinheiro nas respostas é string decimal. Datas são ISO 8601 (nullable conforme persistência). Erros são JSON, podendo conter detalhes extras em APP_DEBUG. Strings de entrada são aparadas e vazias viram null pelo middleware padrão, exceto campos de senha. Campos não validados são descartados; campos explicitamente proibidos são indicados nos schemas. Escritas também podem retornar 409 em colisões de unicidade.

    servers=/ e paths completos /api/... evitam duplicar prefixo e permitem /sanctum/csrf-cookie na raiz. /up é a verificação de saúde do framework. URLs internas de desenvolvimento (_boost) e URLs assinadas de storage do framework não são operações de negócio deste contrato. GET também aceita HEAD conforme registro Laravel.
servers:
  -
    url: /
    description: 'Mesmo host do proxy; paths já contêm /api.'
tags:
  -
    name: 'Sessão e conta'
  -
    name: Catálogo
  -
    name: Produtos
  -
    name: Marcas
  -
    name: Categorias
  -
    name: Carrinho
  -
    name: Endereços
  -
    name: Pedidos
  -
    name: Checkout
  -
    name: 'Admin · Produtos'
  -
    name: 'Admin · Marcas'
  -
    name: 'Admin · Categorias'
  -
    name: 'Admin · Pedidos'
  -
    name: 'Admin · Estoque'
paths:
  /sanctum/csrf-cookie:
    get:
      tags:
        - 'Sessão e conta'
      summary: 'Inicializar cookies e CSRF'
      operationId: get_sanctum_csrf_cookie
      description: 'Pública. Middleware web do Sanctum; envia cookies de sessão e XSRF-TOKEN. Não autentica. Nas escritas, preservar cookies e enviar X-XSRF-TOKEN com o valor URL-decodificado de XSRF-TOKEN.'
      security: []
      responses:
        204:
          description: 'Sucesso, sem corpo.'
  /api/catalog:
    get:
      tags:
        - Catálogo
      summary: 'Catálogo completo sem paginação'
      operationId: get_api_catalog
      description: 'Pública. Categorias ativas e todos os produtos ativos com estoque >=1 em categorias ativas; ordenados por name/id. Produtos incluem brand, sem category.'
      security: []
      responses:
        200:
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Catalog'
                required:
                  - data
  /api/products:
    get:
      tags:
        - Produtos
      summary: 'Listar produtos'
      operationId: get_api_products
      description: 'Pública. Somente ativos com estoque >=1 e categoria ativa; ordenação name/id.'
      security: []
      responses:
        200:
          description: Sucesso.
          content:
            application/json:
              schema:
                allOf:
                  -
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
                    required:
                      - data
                  -
                    $ref: '#/components/schemas/Pagination'
        422:
          $ref: '#/components/responses/Http422'
      parameters:
        -
          $ref: '#/components/parameters/Page'
        -
          $ref: '#/components/parameters/PerPage'
        -
          name: q
          in: query
          description: 'Busca parcial por nome (whereLike).'
          schema:
            type: string
            maxLength: 150
            nullable: true
        -
          name: category_id
          in: query
          description: ''
          schema:
            type: integer
            minimum: 1
        -
          name: 'brand_ids[]'
          in: query
          description: ''
          schema:
            type: array
            items:
              type: integer
              minimum: 1
            maxItems: 100
            uniqueItems: true
          style: form
          explode: true
        -
          name: min_price
          in: query
          description: ''
          schema:
            type: number
            minimum: 0
            maximum: 99999999.99
        -
          name: max_price
          in: query
          description: 'max_price >= min_price.'
          schema:
            type: number
            minimum: 0
            maximum: 99999999.99
        -
          name: specifications
          in: query
          description: 'Mapa JSON, chaves snake_case (até 60 caracteres); até 100 chaves, até 100 alternativas por chave. OR entre valores de uma chave, AND entre chaves. Arrays vazios ignorados. Também aceita specifications[chave][].'
          content:
            application/json:
              schema:
                type: object
                maxProperties: 100
                additionalProperties:
                  type: array
                  items:
                    anyOf:
                      -
                        type: string
                      -
                        type: integer
                      -
                        type: number
                      -
                        type: boolean
                  maxItems: 100
  '/api/products/{product}':
    get:
      tags:
        - Produtos
      summary: 'Consultar produto'
      operationId: get_api_products_product
      description: 'Pública. Somente ativos com estoque >=1 e categoria ativa; ordenação name/id.'
      security: []
      responses:
        200:
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
                required:
                  - data
        404:
          $ref: '#/components/responses/Http404'
    parameters:
      -
        name: product
        in: path
        description: 'Identificador numérico (dígitos), limitado a PHP_INT_MAX. Zeros à esquerda aceitos; 0 normalmente não encontra registro.'
        schema:
          type: integer
          minimum: 0
          maximum: 9223372036854775807
          format: int64
        required: true
  /api/brands:
    get:
      tags:
        - Marcas
      summary: 'Listar marcas'
      operationId: get_api_brands
      description: 'Pública. Todas as marcas, ordenadas por name/id, inclusive sem produtos públicos.'
      security: []
      responses:
        200:
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Brand'
                required:
                  - data
  '/api/brands/{brand}':
    get:
      tags:
        - Marcas
      summary: 'Consultar marca'
      operationId: get_api_brands_brand
      description: 'Pública. Todas as marcas, ordenadas por name/id, inclusive sem produtos públicos.'
      security: []
      responses:
        200:
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Brand'
                required:
                  - data
        404:
          $ref: '#/components/responses/Http404'
    parameters:
      -
        name: brand
        in: path
        description: 'Identificador numérico (dígitos), limitado a PHP_INT_MAX. Zeros à esquerda aceitos; 0 normalmente não encontra registro.'
        schema:
          type: integer
          minimum: 0
          maximum: 9223372036854775807
          format: int64
        required: true
  /api/categories:
    get:
      tags:
        - Categorias
      summary: 'Listar categorias'
      operationId: get_api_categories
      description: 'Pública. Somente categorias ativas, ordenadas por name/id.'
      security: []
      responses:
        200:
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                required:
                  - data
  '/api/categories/{category}':
    get:
      tags:
        - Categorias
      summary: 'Consultar categoria'
      operationId: get_api_categories_category
      description: 'Pública. Somente categorias ativas, ordenadas por name/id.'
      security: []
      responses:
        200:
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
                required:
                  - data
        404:
          $ref: '#/components/responses/Http404'
    parameters:
      -
        name: category
        in: path
        description: 'Identificador numérico (dígitos), limitado a PHP_INT_MAX. Zeros à esquerda aceitos; 0 normalmente não encontra registro.'
        schema:
          type: integer
          minimum: 0
          maximum: 9223372036854775807
          format: int64
        required: true
  /api/products/filter:
    get:
      tags:
        - Produtos
      summary: 'Filtrar produtos por objeto filter'
      operationId: get_api_products_filter
      description: 'Pública. Disponibilidade e ordenação iguais a /api/products.'
      security: []
      responses:
        200:
          description: Sucesso.
          content:
            application/json:
              schema:
                allOf:
                  -
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
                    required:
                      - data
                  -
                    $ref: '#/components/schemas/Pagination'
        422:
          $ref: '#/components/responses/Http422'
      parameters:
        -
          $ref: '#/components/parameters/Page'
        -
          $ref: '#/components/parameters/PerPage'
        -
          name: filter
          in: query
          description: 'Objeto JSON (ou filter[q], filter[brand_ids][], etc.). page e per_page ficam fora de filter. Mesmas regras de /api/products; is_active não é filtro público.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  q:
                    type: string
                    maxLength: 150
                    nullable: true
                  category_id:
                    type: integer
                    minimum: 1
                  brand_ids:
                    type: array
                    items:
                      type: integer
                      minimum: 1
                    maxItems: 100
                    uniqueItems: true
                  min_price:
                    type: number
                    minimum: 0
                    maximum: 99999999.99
                  max_price:
                    type: number
                    minimum: 0
                    maximum: 99999999.99
                  specifications:
                    type: object
                    maxProperties: 100
                    additionalProperties:
                      type: array
                      items:
                        anyOf:
                          -
                            type: string
                          -
                            type: integer
                          -
                            type: number
                          -
                            type: boolean
                      maxItems: 100
  '/api/categories/{category}/filters':
    get:
      tags:
        - Categorias
      summary: 'Valores de filtros disponíveis'
      operationId: get_api_categories_category_filters
      description: 'Pública. '
      security: []
      responses:
        200:
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CategoryFilters'
                required:
                  - data
        404:
          $ref: '#/components/responses/Http404'
    parameters:
      -
        name: category
        in: path
        description: 'Identificador numérico (dígitos), limitado a PHP_INT_MAX. Zeros à esquerda aceitos; 0 normalmente não encontra registro.'
        schema:
          type: integer
          minimum: 0
          maximum: 9223372036854775807
          format: int64
        required: true
  /api/login:
    post:
      tags:
        - 'Sessão e conta'
      summary: 'Entrar com email e senha'
      operationId: post_api_login
      description: 'Pública. Email normalizado para minúsculas. X-Cart-Token ou merge_cart=true fundem carrinho visitante na conta: somam quantidades, limitam ao estoque e removem indisponíveis; retornam cart_merge com ajustes, excluem o carrinho visitante e limpam seu vínculo da sessão. Usa Auth::guard(web)->attempt e regenera sessão. Credenciais inválidas retornam 422 em email. Limites: 20/min por IP e 5/min por email normalizado+IP.'
      security: []
      responses:
        200:
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
        404:
          $ref: '#/components/responses/Http404'
        409:
          $ref: '#/components/responses/Http409'
        419:
          $ref: '#/components/responses/Http419'
        422:
          $ref: '#/components/responses/Http422'
        429:
          $ref: '#/components/responses/Http429'
      parameters:
        -
          $ref: '#/components/parameters/CartToken'
        -
          $ref: '#/components/parameters/Xsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
  /api/user:
    post:
      tags:
        - 'Sessão e conta'
      summary: 'Cadastrar conta CUSTOMER'
      operationId: post_api_user
      description: 'Pública. Email normalizado para minúsculas. X-Cart-Token ou merge_cart=true fundem carrinho visitante na conta: somam quantidades, limitam ao estoque e removem indisponíveis; retornam cart_merge com ajustes, excluem o carrinho visitante e limpam seu vínculo da sessão. Cria CUSTOMER; não inicia login. Limite de 5 cadastros/hora por IP.'
      security: []
      responses:
        201:
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
        404:
          $ref: '#/components/responses/Http404'
        409:
          $ref: '#/components/responses/Http409'
        419:
          $ref: '#/components/responses/Http419'
        422:
          $ref: '#/components/responses/Http422'
        429:
          $ref: '#/components/responses/Http429'
      parameters:
        -
          $ref: '#/components/parameters/CartToken'
        -
          $ref: '#/components/parameters/Xsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
    get:
      tags:
        - 'Sessão e conta'
      summary: 'Consultar próprio perfil'
      operationId: get_api_user
      description: 'Exige sessão autenticada (auth:web), sem restrição por role. '
      security: []
      responses:
        200:
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                required:
                  - data
        401:
          $ref: '#/components/responses/Http401'
      x-access:
        session: true
        gate: null
    put:
      tags:
        - 'Sessão e conta'
      summary: 'Atualizar próprio perfil'
      operationId: put_api_user
      description: 'Exige sessão autenticada (auth:web), sem restrição por role. '
      security: []
      responses:
        200:
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                required:
                  - data
        401:
          $ref: '#/components/responses/Http401'
        409:
          $ref: '#/components/responses/Http409'
        419:
          $ref: '#/components/responses/Http419'
        422:
          $ref: '#/components/responses/Http422'
      x-access:
        session: true
        gate: null
      parameters:
        -
          $ref: '#/components/parameters/Xsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
    patch:
      tags:
        - 'Sessão e conta'
      summary: 'Atualizar próprio perfil'
      operationId: patch_api_user
      description: 'Exige sessão autenticada (auth:web), sem restrição por role. '
      security: []
      responses:
        200:
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                required:
                  - data
        401:
          $ref: '#/components/responses/Http401'
        409:
          $ref: '#/components/responses/Http409'
        419:
          $ref: '#/components/responses/Http419'
        422:
          $ref: '#/components/responses/Http422'
      x-access:
        session: true
        gate: null
      parameters:
        -
          $ref: '#/components/parameters/Xsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
    delete:
      tags:
        - 'Sessão e conta'
      summary: 'Excluir própria conta'
      operationId: delete_api_user
      description: 'Exige sessão autenticada (auth:web), sem restrição por role. Exige senha atual correta (422). Pedidos ou histórico de alteração de senha impedem exclusão (409). Exclui endereços/carrinho por cascade e encerra a sessão.'
      security: []
      responses:
        204:
          description: 'Sucesso, sem corpo.'
        401:
          $ref: '#/components/responses/Http401'
        409:
          $ref: '#/components/responses/Http409'
        419:
          $ref: '#/components/responses/Http419'
        422:
          $ref: '#/components/responses/Http422'
      x-access:
        session: true
        gate: null
      parameters:
        -
          $ref: '#/components/parameters/Xsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUserInput'
  /api/logout:
    post:
      tags:
        - 'Sessão e conta'
      summary: 'Encerrar sessão'
      operationId: post_api_logout
      description: 'Exige sessão autenticada (auth:web), sem restrição por role. Logout do guard web, invalida sessão e regenera token CSRF. Inicialize CSRF antes de novo login.'
      security: []
      responses:
        204:
          description: 'Sucesso, sem corpo.'
        401:
          $ref: '#/components/responses/Http401'
        419:
          $ref: '#/components/responses/Http419'
      x-access:
        session: true
        gate: null
      parameters:
        -
          $ref: '#/components/parameters/Xsrf'
  /api/user/password:
    put:
      tags:
        - 'Sessão e conta'
      summary: 'Alterar senha e encerrar sessão'
      operationId: put_api_user_password
      description: 'Exige sessão autenticada (auth:web), sem restrição por role. Valida senha atual, registra histórico, renova remember_token; com SESSION_DRIVER=database remove todas as sessões do usuário. Logout invalida a sessão corrente.'
      security: []
      responses:
        204:
          description: 'Sucesso, sem corpo.'
        401:
          $ref: '#/components/responses/Http401'
        419:
          $ref: '#/components/responses/Http419'
        422:
          $ref: '#/components/responses/Http422'
      x-access:
        session: true
        gate: null
      parameters:
        -
          $ref: '#/components/parameters/Xsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordInput'
  /api/addresses:
    get:
      tags:
        - Endereços
      summary: 'Listar próprios endereços'
      operationId: get_api_addresses
      description: 'Exige sessão autenticada (auth:web), sem restrição por role. Sem paginação; ordem crescente de id. Sempre limitado ao proprietário, inclusive ADMIN.'
      security: []
      responses:
        200:
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Address'
                required:
                  - data
        401:
          $ref: '#/components/responses/Http401'
      x-access:
        session: true
        gate: null
    post:
      tags:
        - Endereços
      summary: 'Criar endereço'
      operationId: post_api_addresses
      description: 'Exige sessão autenticada (auth:web), sem restrição por role. '
      security: []
      responses:
        201:
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Address'
                required:
                  - data
        401:
          $ref: '#/components/responses/Http401'
        419:
          $ref: '#/components/responses/Http419'
        422:
          $ref: '#/components/responses/Http422'
      x-access:
        session: true
        gate: null
      parameters:
        -
          $ref: '#/components/parameters/Xsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
  '/api/addresses/{id}':
    get:
      tags:
        - Endereços
      summary: 'Consultar próprio endereço'
      operationId: get_api_addresses_id
      description: 'Exige sessão autenticada (auth:web), sem restrição por role. Endereço de outro usuário retorna 404, inclusive para ADMIN.'
      security: []
      responses:
        200:
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Address'
                required:
                  - data
        401:
          $ref: '#/components/responses/Http401'
        404:
          $ref: '#/components/responses/Http404'
      x-access:
        session: true
        gate: null
    put:
      tags:
        - Endereços
      summary: 'Atualizar próprio endereço'
      operationId: put_api_addresses_id
      description: 'Exige sessão autenticada (auth:web), sem restrição por role. '
      security: []
      responses:
        200:
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Address'
                required:
                  - data
        401:
          $ref: '#/components/responses/Http401'
        404:
          $ref: '#/components/responses/Http404'
        419:
          $ref: '#/components/responses/Http419'
        422:
          $ref: '#/components/responses/Http422'
      x-access:
        session: true
        gate: null
      parameters:
        -
          $ref: '#/components/parameters/Xsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpdateInput'
    patch:
      tags:
        - Endereços
      summary: 'Atualizar próprio endereço'
      operationId: patch_api_addresses_id
      description: 'Exige sessão autenticada (auth:web), sem restrição por role. '
      security: []
      responses:
        200:
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Address'
                required:
                  - data
        401:
          $ref: '#/components/responses/Http401'
        404:
          $ref: '#/components/responses/Http404'
        419:

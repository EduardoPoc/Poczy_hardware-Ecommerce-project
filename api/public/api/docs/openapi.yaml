              schema:
                type: string
components:
  parameters:
    Page:
      name: page
      in: query
      description: ''
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      description: ''
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CartToken:
      name: X-Cart-Token
      in: header
      description: 'Opcional: token retornado ao criar carrinho visitante. Exige também a mesma sessão; token inválido retorna 404. Login/cadastro com este header solicitam fusão mesmo sem merge_cart=true. Não é token de autenticação da API.'
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
    Xsrf:
      name: X-XSRF-TOKEN
      in: header
      description: 'Valor URL-decodificado do cookie XSRF-TOKEN emitido por GET /sanctum/csrf-cookie. A UI envia automaticamente; necessário em escritas com middleware web.'
      schema:
        type: string
  responses:
    Http401:
      description: 'Sessão não autenticada (Unauthenticated.).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Http403:
      description: 'Gate manage-shop negado: role diferente de ADMIN.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Http404:
      description: 'Recurso inexistente, indisponível, fora do escopo permitido ou identificador inválido (somente dígitos, limitado a PHP_INT_MAX).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Http409:
      description: 'Conflito com estado/histórico ou colisão de unicidade (A record with the provided unique values already exists.).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Http419:
      description: 'Token CSRF ausente/inválido (CSRF token mismatch.). Inicialize a sessão em /sanctum/csrf-cookie.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Http422:
      description: 'Validação de entrada ou regra de negócio; errors mapeia campos (inclusive caminhos pontuados) para listas de mensagens.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            message: 'The provided credentials are invalid.'
            errors:
              email:
                - 'The provided credentials are invalid.'
    Http429:
      description: 'Limite de tentativas excedido. Respeite Retry-After.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: 'Segundos para tentar novamente.'
          schema:
            type: integer
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
      additionalProperties: true
      description: 'Em APP_DEBUG=true, Laravel também pode incluir exception, file, line e trace.'
      required:
        - message
    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - message
        - errors
    Brand:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      required:
        - id
        - name
    AttributeDefinition:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - text
            - integer
            - number
            - boolean
        unit:
          type: string
          nullable: true
        options:
          type: array
          items:
            anyOf:
              -
                type: string
              -
                type: integer
              -
                type: number
              -
                type: boolean
        required:
          type: boolean
        is_filterable:
          type: boolean
        minimum:
          type: number
        maximum:
          type: number
        exclusive_minimum:
          type: number
        exclusive_maximum:
          type: number
      additionalProperties: false
      description: 'Tipos JSON estritos; text aceita até 1000 caracteres. options deve respeitar tipo e limites. Limites finitos somente em tipos numéricos e não podem formar intervalo vazio. is_filterable assume true no cálculo de filtros; required assume false. A chave reservada brand só aceita type=text e required=false; produtos usam brand_id.'
      required:
        - name
        - type
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        attributes:
          nullable: true
          anyOf:
            -
              type: object
              maxProperties: 100
              additionalProperties:
                $ref: '#/components/schemas/AttributeDefinition'
              description: 'Mapa de chaves snake_case: ^[a-z][a-z0-9_]{0,59}$. Pode ser um array vazio [] quando não há definições.'
              nullable: true
            -
              type: array
              items:
                description: 'Nenhum item permitido (maxItems=0).'
              maxItems: 0
              nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - description
        - attributes
        - is_active
        - created_at
        - updated_at
    Product:
      type: object
      properties:
        id:
          type: integer
          format: int64
        category_id:
          type: integer
          format: int64
        brand_id:
          type: integer
          format: int64
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        specifications:
          nullable: true
          anyOf:
            -
              type: object
              maxProperties: 100
              additionalProperties:
                anyOf:
                  -
                    type: string
                  -
                    type: integer
                  -
                    type: number
                  -
                    type: boolean
              nullable: true
            -

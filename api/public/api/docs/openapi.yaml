                  - name
                  - type
                  - values
            -
              type: array
              items:
                description: 'Nenhum item permitido (maxItems=0).'
              maxItems: 0
        min_price:
          type: string
          pattern: '^\d+\.\d{2}$'
          example: '199.90'
          description: 'Decimal serializado como string com duas casas.'
          nullable: true
        max_price:
          type: string
          pattern: '^\d+\.\d{2}$'
          example: '199.90'
          description: 'Decimal serializado como string com duas casas.'
          nullable: true

      type: object
      properties:
        brands:
          type: array
          items:
            $ref: '#/components/schemas/Brand'
        attributes:
          anyOf:
            -
              type: object
              additionalProperties:
                type: object
                properties:
                  name:
                    type: string
                  type:
                    type: string
                    enum:
                      - text
                      - integer
                      - number
                      - boolean
                  unit:
                    type: string
                    nullable: true
                  options:
                    type: array
                    items:
                      anyOf:
                        -
                          type: string
                        -
                          type: integer
                        -
                          type: number
                        -
                          type: boolean
                  required:
                    type: boolean
                  is_filterable:
                    type: boolean
                  minimum:
                    type: number
                  maximum:
                    type: number
                  exclusive_minimum:
                    type: number
                  exclusive_maximum:
                    type: number
                  values:
                    type: array
                    items:
                      anyOf:
                        -
                          type: string
                        -
                          type: integer
                        -
                          type: number
                        -
                          type: boolean
                additionalProperties: false
                description: 'Tipos JSON estritos; text aceita até 1000 caracteres. options deve respeitar tipo e limites. Limites finitos somente em tipos numéricos e não podem formar intervalo vazio. is_filterable assume true no cálculo de filtros; required assume false. A chave reservada brand só aceita type=text e required=false; produtos usam brand_id.'

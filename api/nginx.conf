map $http_x_forwarded_proto $public_scheme {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    absolute_redirect off;

    charset utf-8;
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_backend api:9000;
    set $frontend_upstream http://frontend:80;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /api/docs {
        try_files /api/docs/index.html =404;
    }

    location ^~ /api/docs/ {
        index index.html;
        try_files $uri $uri/ =404;
    }

    location / {
        proxy_pass $frontend_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_scheme;
    }

    location ~ ^/(api|sanctum)(/|$) {
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage/ {
        try_files $uri =404;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass $php_backend;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_X_FORWARDED_PROTO $public_scheme;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}

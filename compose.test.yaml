name: poczy-tests

services:
  mysql_test:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ecommerce_test
      MYSQL_USER: ecommerce_test
      MYSQL_PASSWORD: ecommerce_test
      MYSQL_ROOT_PASSWORD: test_root_only
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    environment:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: mysql_test
      DB_PORT: 3306
      DB_DATABASE: ecommerce_test
      DB_USERNAME: ecommerce_test
      DB_PASSWORD: ecommerce_test
      DB_URL: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    depends_on:
      mysql_test:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        if [ ! -f .env ]; then cp .env.example .env; fi
        php artisan config:clear --no-interaction
        exec php artisan test --compact

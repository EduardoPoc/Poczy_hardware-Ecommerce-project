<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Poczy Hardware — componentes para PC" />
    <title>Produto — Poczy Hardware</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <div class="page-shell product-page">
      <div class="container-xl px-0">
        <header class="site-header">
          <a class="brand-logo" href="index.html" aria-label="Poczy Hardware — início"><img src="./assets/logo1.svg" alt="Poczy Hardware" /></a>

          <form class="search-form" role="search" action="pesquisa.html" method="get">
            <label class="visually-hidden" for="product-search">Buscar produtos</label>
            <i class="bi bi-search search-field-icon" aria-hidden="true"></i>
            <input id="product-search" name="q" type="search" placeholder="Buscar produtos..." required />
            <button class="search-clear" type="button" aria-label="Limpar busca" hidden><i class="bi bi-x-lg" aria-hidden="true"></i></button>
            <button class="search-submit" type="submit" aria-label="Buscar"><i class="bi bi-search" aria-hidden="true"></i></button>
          </form>

          <a class="cart-link" href="carrinho.html"><i class="bi bi-cart3" aria-hidden="true"></i> Carrinho <span class="cart-count" data-cart-count hidden></span></a>
          <a class="login-link" href="login.html"><i class="bi bi-person" aria-hidden="true"></i> <span data-account-label>Entrar</span></a>
        </header>

        <main id="product-detail"></main>
        <footer class="product-footer"><a href="index.html">Poczy Hardware</a><span>Seu próximo setup começa aqui.</span></footer>
      </div>
    </div>
    <dialog id="image-dialog" class="product-dialog image-dialog" aria-label="Imagem ampliada do produto">
      <button type="button" class="dialog-close" data-close aria-label="Fechar imagem">×</button>
      <div id="expanded-artwork"></div>
    </dialog>
    <p class="product-notice" id="product-notice" role="status" hidden></p>
    <script type="module" src="./src/scripts/product.js"></script>
  </body>
</html>

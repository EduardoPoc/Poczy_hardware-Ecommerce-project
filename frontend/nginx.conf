server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location = /index.html {
        return 301 /$is_args$args;
    }

    location ~ ^/(login|cadastro|pesquisa|produto|carrinho|admin|conta|checkout)(\.html|/)$ {
        return 301 /$1$is_args$args;
    }

    location / {
        expires -1;
        try_files $uri $uri.html $uri/index.html =404;
    }
}

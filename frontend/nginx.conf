server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location = /index.html {
        return 301 /$is_args$args;
    }

    location ~ ^/(login|cadastro|pesquisa|produto|carrinho|admin|conta|checkout)(\.html|/)$ {
        return 301 /$1$is_args$args;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
